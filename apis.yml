name: Revolv
description: Revolv was a smart-home company that built a connected home hub and mobile
  application to unify control of disparate smart-home devices and wireless protocols
  from a single app. The company was acquired by Nest (Google) and the Revolv hub and
  service were subsequently discontinued; owners of purchased Revolv hubs were directed
  to Nest support for refunds through a deadline of October 31, 2018. This API Evangelist
  profile is retained as a historical portfolio record. The company publishes no active
  API, developer portal, SDKs, or public developer surface, so this entry carries only
  a domain-security probe of its remaining web presence.
